services:
  - type: web
    name: knowtomorrow
    runtime: node
    plan: starter
    buildCommand: "true"
    startCommand: "node server/index.mjs"
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 24.0.0
      - key: DATA_DIR
        value: /var/data
      - key: COOKIE_SECURE
        value: "true"
      - key: TRUST_PROXY
        value: "1"
      - key: MIN_PRIOR_USERS
        value: "5"
      - key: ADMIN_TOKEN
        sync: false
    disk:
      name: knowtomorrow-data
      mountPath: /var/data
      sizeGB: 1
