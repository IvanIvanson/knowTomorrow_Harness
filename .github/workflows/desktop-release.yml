name: Desktop release

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
          - os: macos-latest
            name: macos
          - os: ubuntu-latest
            name: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Set application URL
        env:
          APP_URL: ${{ vars.KNOWTOMORROW_APP_URL }}
        run: |
          node -e "const fs=require('fs');const p='desktop/config.json';const c=JSON.parse(fs.readFileSync(p,'utf8'));if(process.env.APP_URL){c.appUrl=process.env.APP_URL;}fs.writeFileSync(p,JSON.stringify(c,null,2));console.log('appUrl =',c.appUrl);"
      - name: Check URL for tag builds
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          APP_URL: ${{ vars.KNOWTOMORROW_APP_URL }}
        run: |
          if [ -z "$APP_URL" ]; then
            echo "::error::Задайте repository variable KNOWTOMORROW_APP_URL (HTTPS-адрес сайта) перед релизом."
            exit 1
          fi
      - name: Install desktop dependencies
        working-directory: desktop
        run: npm install --no-audit --no-fund
      - name: Build desktop artifacts
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run build -- --publish never
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: knowtomorrow-desktop-${{ matrix.name }}
          path: |
            desktop/dist/*.exe
            desktop/dist/*.dmg
            desktop/dist/*.zip
            desktop/dist/*.AppImage
            desktop/dist/*.deb
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
