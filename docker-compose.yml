services:
  knowtomorrow:
    build: .
    container_name: knowtomorrow
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./data:/data
    environment:
      DATA_DIR: /data
      # Для локального HTTP. В production за HTTPS поставьте true.
      COOKIE_SECURE: "false"
      TRUST_PROXY: "0"
      # APP_ORIGIN: https://knowtomorrow.example
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8080/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
